# Render Blueprint: the Gavyora API and website. In Render: New → Blueprint → pick this repository.
# Render asks for every value marked `sync: false` when the Blueprint is first applied (they are secrets or
# depend on your domain, so they are never stored in the repository).
#
# Order on first deploy:
#   1. Apply the Blueprint. Fill MONGO_URI, SUPERADMIN_EMAIL, SUPERADMIN_PASSWORD now; leave CLIENT_URL and
#      VITE_API_URL as placeholders if you don't know the final addresses yet.
#   2. Once both services have addresses, set:
#        gavyora-api → CLIENT_URL   = the website's address, e.g. https://gavyora-web.onrender.com (or https://gavyora.com)
#        gavyora-web → VITE_API_URL = the API's address + /api, e.g. https://gavyora-api.onrender.com/api
#      then redeploy both (the website bakes VITE_API_URL into its build and security policy).
#   3. Open https://<api address>/api/health → {"ok":true}, then log in as the owner and run Security audit.

services:
  # ── API: Express + MongoDB, with the built-in background jobs (9 PM deliveries, renewals, retries…) ──
  - type: web
    name: gavyora-api
    runtime: node
    rootDir: server
    region: singapore # closest to India; create the Atlas cluster in the same region if you can
    # Starter or above: the free plan sleeps after 15 idle minutes, and while asleep no background job runs.
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Atlas connection string with the database name, e.g. mongodb+srv://USER:PASSWORD@cluster0.xxxxx.mongodb.net/gavyora?retryWrites=true&w=majority
      - key: MONGO_URI
        sync: false
      # Random 256-bit secrets generated by Render (rotate by regenerating; everyone is logged out).
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Exact website origin(s), https, no trailing slash. Comma separate several (e.g. the onrender.com address and your domain).
      - key: CLIENT_URL
        sync: false
      # lax when the website and API share a site (gavyora.com + api.gavyora.com). See the note at the end of this file.
      - key: COOKIE_SAMESITE
        value: lax
      - key: TRUST_PROXY
        value: "1"
      # First owner account (only created when the database is empty). 12+ characters, not a demo password.
      # Log in, change it, then delete SUPERADMIN_PASSWORD here.
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      # Razorpay: leave all three empty until you have live keys (online payment stays off, it is never faked).
      # Webhook URL to set in Razorpay: https://<api address>/api/payments/webhook
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # ── Website: the React build served from Render's CDN ──
  - type: web
    name: gavyora-web
    runtime: static
    rootDir: client
    # Vite is a build-only (dev) dependency, so the install must include dev dependencies.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API's address + /api. Public (compiled into the site); never put secrets in VITE_ variables.
      - key: VITE_API_URL
        sync: false
    # Every page is handled by the React app, so unknown paths serve index.html (refreshing /account works).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # The same security headers as client/vercel.json (Render does not read that file).
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), geolocation=(self), microphone=(), payment=(self "https://api.razorpay.com")
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'; object-src 'none'; base-uri 'self'
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

# Login cookies and domains:
# *.onrender.com addresses count as unrelated sites to browsers, so with the default addresses login cookies are
# third-party and Safari (and Chrome with third-party cookies blocked) will not keep customers logged in.
# For a real launch, give both services your own domain in Settings → Custom Domains (gavyora.com for gavyora-web,
# api.gavyora.com for gavyora-api), set CLIENT_URL=https://gavyora.com and VITE_API_URL=https://api.gavyora.com/api,
# and keep COOKIE_SAMESITE=lax. Only for testing on the onrender.com addresses, set COOKIE_SAMESITE=none.
