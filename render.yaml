# Render Blueprint: Gavyora as ONE web service. The API also serves the built website from the same address, so
# login cookies are first-party (no cross-site cookie problems) and there is only one service to pay for and watch.
# In Render: New → Blueprint → pick this repository. Render asks for every value marked `sync: false`.
#
# After the first deploy:
#   1. Copy the service's address (e.g. https://gavyora.onrender.com) into CLIENT_URL and redeploy.
#   2. Open https://<address>/api/health → {"ok":true}, then log in as the owner, change the password,
#      delete SUPERADMIN_PASSWORD here, and run Security audit in the super admin panel.
#   3. With your own domain: add it under Settings → Custom Domains and put it in CLIENT_URL
#      (comma-separate to keep the onrender.com address working too).

services:
  - type: web
    name: gavyora
    runtime: node
    region: singapore # closest to India; create the Atlas cluster in the same region if you can
    # Starter or above: the free plan sleeps after 15 idle minutes, and while asleep no background job runs
    # (9 PM delivery generation, renewals, unpaid-order expiry, notification retries).
    plan: starter
    # Root of the repository. The build installs and builds the website (client/) and installs the API's
    # production packages (server/); start runs the API, which serves the website too.
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Atlas connection string with the database name:
      # mongodb+srv://USER:PASSWORD@cluster0.xxxxx.mongodb.net/gavyora?retryWrites=true&w=majority
      - key: MONGO_URI
        sync: false
      # Random 256-bit secrets generated by Render (regenerating one logs everyone out).
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # This service's own https address (no trailing slash), plus your domain once added, comma separated.
      - key: CLIENT_URL
        sync: false
      # Same address for website and API, so lax is right.
      - key: COOKIE_SAMESITE
        value: lax
      - key: TRUST_PROXY
        value: "1"
      # Website calls the API on its own address (/api), so no VITE_API_URL is needed.
      # First owner account (created only when the database is empty). 12+ characters, not a demo password.
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      # Razorpay: leave empty until you have keys (online payment stays off; it is never faked).
      # Webhook URL to set in Razorpay: https://<address>/api/payments/webhook
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
