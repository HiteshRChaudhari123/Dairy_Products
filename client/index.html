    <script>
      // Set the theme before first paint so there is no light/dark flash: saved choice, else the OS setting.
      try {
        var t = localStorage.getItem('gv_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
